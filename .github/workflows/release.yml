name: Release

# On main: if there are changesets, open or update the "Version packages" PR.
# Merging that PR publishes pixelbits to npm with provenance.
on:
  push:
    branches: [main]

# Never cancel a running release; queue the next one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read # default for any job added later

jobs:
  release:
    name: Version PR or npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm # protection rules (reviewers) can gate publishing
    permissions:
      contents: write # version commit and tag
      pull-requests: write # "Version packages" PR
      id-token: write # npm provenance / trusted publishing (OIDC)
    steps:
      # changesets/action pushes the version branch and tag with the checkout
      # credentials; this job uploads no artifacts.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm turbo run test --filter=pixelbits
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: Version packages
          commit-message: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: npm trusts this workflow (trusted publishing), and
          # pnpm publish gets a short-lived OIDC token via id-token: write.
          NPM_CONFIG_PROVENANCE: "true"
