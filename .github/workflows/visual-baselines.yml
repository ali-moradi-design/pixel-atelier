name: Update visual baselines

# Run by hand after an intended visual change: renders the baselines on the
# same Linux runner image CI compares against, and commits them to the branch.
on:
  workflow_dispatch:

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # checkout only

jobs:
  update:
    name: Render and commit baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit the new baselines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pixel-atelier/storybook...
      - run: pnpm --filter @pixel-atelier/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @pixel-atelier/storybook test:browser:update
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/browser/__screenshots__
          git diff --cached --quiet || git commit -m "Update visual baselines"
          # The token is used only for this push (not stored in .git/config).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
