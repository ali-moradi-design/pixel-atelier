name: Update visual baselines

# Run by hand after an intended visual change: renders the baselines on the
# same Linux runner image CI compares against, and commits them to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pixel-atelier/storybook...
      - run: pnpm --filter @pixel-atelier/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @pixel-atelier/storybook test:browser:update
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/browser/__screenshots__
          git diff --cached --quiet || git commit -m "Update visual baselines"
          git push
