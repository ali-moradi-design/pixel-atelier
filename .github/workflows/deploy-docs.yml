name: Deploy docs

# Builds the docs site (with Storybook under /storybook) on Linux and copies
# it to the VPS: https://pixelbits.ali-moradi-develop.com
# Always deploy this Linux build: a Windows build writes Next.js prefetch
# files as nested folders, and the browser gets 404s for them.
# The build and rsync steps live in deploy-kit (shared by every static demo).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # checkout only

jobs:
  deploy:
    name: Build and deploy
    uses: ali-moradi-design/deploy-kit/.github/workflows/deploy-static.yml@ed4a1649d523120609b56471f232facb73e32fb0 # v1.0.0
    # The deploy job needs the "docs" environment's SSH secrets; deploy-kit is
    # ours and pinned to a SHA, so passing them on is safe.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      site-url: https://pixelbits.ali-moradi-develop.com
      output-dir: apps/docs/out
      # Environment "docs": only main may deploy; holds the SSH key, which on
      # the server may only rsync inside /srv/static/pixelbits.
      environment: docs
      # The prefetch file proves this was a Linux build (see above).
      smoke-paths: / /storybook/ /r/button.json /__next.!KGVuKQ.__PAGE__.txt
