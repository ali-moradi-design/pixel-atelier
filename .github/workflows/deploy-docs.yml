name: Deploy docs

# Builds the docs site (with Storybook under /storybook) on Linux, packs the
# standalone Next.js server into an image and deploys it to the VPS:
# https://pixelbits.ali-moradi-develop.com
# The image holds only the build output (apps/docs/.next/standalone).
# The deploy step lives in deploy-kit (shared by every app).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # builds the kit, Storybook and the docs, then checks every page's CSP
      - run: pnpm turbo run build --filter=@pixelbits/docs
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ghcr.io/ali-moradi-design/pixelbits-docs:${{ github.sha }}
        run: |
          docker build -f apps/docs/Dockerfile -t "$IMAGE" apps/docs/.next/standalone
          docker push "$IMAGE"

  deploy:
    needs: image
    uses: ali-moradi-design/deploy-kit/.github/workflows/deploy-app.yml@ed4a1649d523120609b56471f232facb73e32fb0 # v1.0.0
    # The deploy job needs the "docs" environment's SSH secrets; deploy-kit is
    # ours and pinned to a SHA, so passing them on is safe.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      image-tag: ${{ needs.image.outputs.sha }}
      site-url: https://pixelbits.ali-moradi-develop.com
      # Environment "docs": only main may deploy; holds the SSH key, which on
      # the server may only run `deploy-app pixelbits <sha>`.
      environment: docs
      smoke-paths: / /docs/button/ /fa/ /storybook/ /r/button.json
