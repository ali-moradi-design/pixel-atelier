name: Deploy docs

# Builds the docs site (with Storybook under /storybook) on Linux and copies
# it to the VPS: https://pixelbits.ali-moradi-develop.com
# Always deploy this Linux build: a Windows build writes Next.js prefetch
# files as nested folders, and the browser gets 404s for them.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a running deploy; queue the next one.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read # checkout only

jobs:
  build:
    name: Build the static site
    # No secrets in this job: install scripts and the build never see the key.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # One archive keeps every file name exactly ("!", "$") and uploads
      # faster than ~500 small files.
      - run: tar -czf docs-site.tgz -C apps/docs/out .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs-site.tgz
          retention-days: 7

  deploy:
    name: Copy to the server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environment "docs": only main may deploy; holds the SSH key.
    environment:
      name: docs
      url: https://pixelbits.ali-moradi-develop.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
      - run: mkdir site && tar -xzf docs-site.tgz -C site
      # Secrets reach the shell only through env, never as ${{ }} in run.
      - name: SSH key and known host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # On the server this key may only run rsync inside
      # /srv/static/pixelbits (forced command rrsync), so "/" is that folder.
      # -c: compare by checksum (unchanged files keep their ETag)
      # --delete-delay / --delay-updates: swap all files in at the end
      - name: rsync
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: >-
          rsync -rlc --delete-delay --delay-updates --chmod=D755,F644 --stats
          -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes"
          site/ "$SSH_USER@$SSH_HOST:/"
      - name: Smoke test
        run: |
          base=https://pixelbits.ali-moradi-develop.com
          for path in / /storybook/ /r/button.json '/__next.!KGVuKQ.__PAGE__.txt'; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 3 --retry-delay 5 --retry-all-errors "$base$path"
            echo "ok $path"
          done
      - if: always()
        run: rm -f ~/.ssh/deploy_key
