name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tags can be moved by an attacker).
permissions:
  contents: read # checkout only

jobs:
  check:
    name: Lint, types, unit tests, build, size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --frozen-lockfile also enforces the supply-chain policies in pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm turbo run typecheck test build
      - name: Bundle size budget
        run: pnpm --filter pixel-atelier size

  browser:
    name: Browser: axe and visual regression
    # Real-browser checks: visual regression of key stories and axe (with
    # color contrast) in both themes. Unit tests run in the job above.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pixel-atelier/storybook...
      - run: pnpm --filter @pixel-atelier/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @pixel-atelier/storybook test:browser
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/storybook/playwright-report
            apps/storybook/test-results
