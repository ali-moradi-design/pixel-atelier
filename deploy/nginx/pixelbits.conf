# pixelbits.ali-moradi-develop.com -> the docs container on 127.0.0.1:3102.
# The app sets its own headers (CSP with a nonce, HSTS, cache headers, CORS for
# /r/); see apps/docs/next.config.ts and apps/docs/proxy.ts. There is no
# database and nothing to submit, so Nginx only lets reads through.
#
# Install: /etc/nginx/sites-available/pixelbits, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`. certbot --nginx adds the TLS server
# block; keep the lines below in it.

server {
    listen 80;
    listen [::]:80;
    server_name pixelbits.ali-moradi-develop.com;

    server_tokens off;            # do not advertise the Nginx version
    client_max_body_size 1k;      # nothing is ever uploaded here
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Only reading is possible: POST/PUT/DELETE… get 405 before reaching Node.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Hidden files (.git, .env…) are never served.
    location ~ /\. { deny all; }

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
