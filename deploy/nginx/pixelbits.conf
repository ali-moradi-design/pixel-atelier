# pixelbits.ali-moradi-develop.com: the docs site is plain static files
# (apps/docs/out, rsynced to /srv/static/pixelbits). There is no app
# server and no database behind it, so form input has nowhere to go; this
# config makes sure the web server itself stays a read-only file server.
#
# Install: /etc/nginx/sites-available/pixelbits, symlink into
# sites-enabled, `nginx -t`, `systemctl reload nginx`. certbot --nginx adds
# the TLS server block; keep the headers below in it.

server {
    listen 80;
    listen [::]:80;
    server_name pixelbits.ali-moradi-develop.com;

    root /srv/static/pixelbits;
    index index.html;
    server_tokens off;            # do not advertise the Nginx version
    client_max_body_size 1k;      # nothing is ever uploaded here
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Only reading is possible: POST/PUT/DELETE… get 405, so no request body
    # (from a form or a script) is ever processed.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Security headers. Pages also carry a per-page CSP <meta> with script
    # hashes (apps/docs/scripts/csp.ts); this header adds what <meta> cannot.
    # (security-headers.conf lives next to this file: /etc/nginx/snippets/)
    include snippets/pixelbits-security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;

    # Hidden files (.git, .env…) never exist here, and never get served.
    location ~ /\. { deny all; }

    # Hashed Next.js assets: cache for a year.
    location /_next/static/ {
        include snippets/pixelbits-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # shadcn registry JSON: readable by the shadcn CLI from anywhere.
    location /r/ {
        default_type application/json;
        include snippets/pixelbits-security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Storybook is a separate static app with its own inline scripts.
    location /storybook/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
        include snippets/pixelbits-security-headers.conf;
        try_files $uri $uri/ =404;
    }

    location / {
        include snippets/pixelbits-security-headers.conf;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Light rate limit against scraping/abuse (zone defined in nginx.conf:
    # limit_req_zone $binary_remote_addr zone=static:10m rate=20r/s;)
    # limit_req zone=static burst=40 nodelay;
}
